server:
  port: 8080
  shutdown: graceful
  tomcat:
    max-connections: 10000
    accept-count: 1000

spring:
  jackson:
    # Wire 约定：普通 DTO 的空值字段省略；只有显式标记为 required+nullable
    # 的字段和信封 data 才稳定输出 JSON null。
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://localhost:3306/zhiyi_campus?characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000
      max-lifetime: 1800000
      keepalive-time: 300000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB
  web:
    error:
      include-message: never
      include-stacktrace: never

springdoc:
  paths-to-match: /api/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    document-title: 智易校园 API 文档
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

zhiyi:
  # 上传目录。显式占位符便于按环境覆盖（如独立部署时指向数据盘）；
  upload-path: ${ZHIYI_UPLOAD_PATH:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:24h}
  moderation:
    rule-version: ${MODERATION_RULE_VERSION:2026.1}
    warning-points: ${CONTENT_WARNING_POINTS:5}
    appeal-window-days: ${APPEAL_WINDOW_DAYS:7}
  marketplace:
    # 浏览量有界缓冲与批量刷新（详情路径零数据库写）
    view-flush-interval-ms: ${VIEW_FLUSH_INTERVAL_MS:5000}
    view-buffer-max-keys: ${VIEW_BUFFER_MAX_KEYS:50000}
  auth:
    # 登录/密保失败限流（数据库固定窗口状态机）
    login-fail-limit: ${LOGIN_FAIL_LIMIT:5}
    login-fail-window-seconds: ${LOGIN_FAIL_WINDOW_SECONDS:900}
    login-fail-lock-seconds: ${LOGIN_FAIL_LOCK_SECONDS:300}
    login-attempt-purge-retention-seconds: ${LOGIN_ATTEMPT_PURGE_RETENTION_SECONDS:86400}
    cookie-name: ${AUTH_COOKIE_NAME:zhiyi_token}
    # 生产（HTTPS）部署时置 true，Cookie 仅经加密通道传输
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  trade:
    # 交易事务外有界准入：全局并发上限（须小于连接池并预留非交易请求空间）与等待预算
    admission-global-slots: ${TRADE_ADMISSION_GLOBAL_SLOTS:30}
    admission-wait-millis: ${TRADE_ADMISSION_WAIT_MILLIS:200}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
  sse:
    # 聊天事件 SSE：单连接生命周期上限（到期由容器断开，浏览器自动重连）与心跳间隔
    timeout-ms: ${SSE_TIMEOUT_MS:1800000}
    heartbeat-interval-ms: ${SSE_HEARTBEAT_INTERVAL_MS:20000}
  feed:
    # 签名游标有效期与签名密钥（默认复用 JWT 密钥属性；解析顺序：环境 FEED_CURSOR_SECRET → zhiyi.jwt.secret）
    cursor-ttl-seconds: ${FEED_CURSOR_TTL_SECONDS:900}
    cursor-secret: ${FEED_CURSOR_SECRET:${zhiyi.jwt.secret}}
