server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-connections: 10000
    accept-count: 1000

spring:
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://localhost:3306/zhiyi_campus?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000
      max-lifetime: 1800000
      keepalive-time: 300000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

zhiyi:
  upload-path: ./uploads
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:24h}
  moderation:
    rule-version: ${MODERATION_RULE_VERSION:2026.1}
    warning-points: ${CONTENT_WARNING_POINTS:5}
    appeal-window-days: ${APPEAL_WINDOW_DAYS:7}
  auth:
    login-fail-limit: 5
    login-fail-lock-seconds: 300
    user-state-cache-seconds: 60
